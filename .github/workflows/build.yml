name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode and check keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          CLEAN=$(printf '%s' "$KS" | tr -d ' \r\n\t')
          echo "KEYSTORE_BASE64 length: ${#CLEAN} (expected 3472)"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD} (expected 20)"
          echo "KEY_ALIAS length: ${#KEY_ALIAS} (expected 8)"
          printf '%s' "$CLEAN" | base64 -d > app/release.jks
          keytool -list -keystore app/release.jks -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 > /dev/null \
            && echo "Keystore OK" || { echo "::error::Keystore or password is wrong"; exit 1; }

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Makharej-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Makharej-${{ github.run_number }}
          path: Makharej-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: Makharej-${{ github.run_number }}.apk
