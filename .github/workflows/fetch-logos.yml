name: Fetch logos
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          get() { curl -sSL -A "Mozilla/5.0" --max-time 20 -o "$1" "$2" && file "$1" | grep -qiE "image|icon|svg" && { echo "OK $1 $(file -b $1)"; echo "B64BEGIN $1"; base64 -w0 "$1"; echo; echo "B64END $1"; } || { echo "FAIL $1"; rm -f "$1"; }; }
          get blu-g.png "https://www.google.com/s2/favicons?domain=www.blubank.com&sz=256"
          get blu-ddg.ico https://icons.duckduckgo.com/ip3/www.blubank.com.ico
          get mofid-touch.png https://emofid.com/favicon/apple-touch-icon.png
          get mofid-pin.svg https://emofid.com/favicon/safari-pinned-tab.svg
          get mofid-og.jpg https://emofidapi.mofid.dc/wp-content/uploads/2024/01/mofid.jpg
          curl -sSL -A "Mozilla/5.0" --max-time 20 https://www.blubank.com/ -o blu.html; echo "blu html $(stat -c%s blu.html)"; grep -oiE '<link[^>]+>|<meta[^>]+image[^>]*>' blu.html | grep -iE "icon|image|manifest" | head
